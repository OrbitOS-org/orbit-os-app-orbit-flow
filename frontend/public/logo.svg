    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a08bff"/>
      <stop offset="0.5" stop-color="#6f52e6"/>
      <stop offset="1" stop-color="#3f25a3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <path d="M27 32 C33 32 31 18 37 18 M27 32 C33 32 31 46 37 46" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#0d1117">
