    <rect x="14" y="33.5" width="6" height="2.2" rx="1.1"/>
    <rect x="44" y="15" width="9" height="2.2" rx="1.1"/>
    <rect x="44" y="19.5" width="6" height="2.2" rx="1.1"/>
