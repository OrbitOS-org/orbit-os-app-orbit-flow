<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      <base> is rewritten by the Go backend at request time so the same
      build works at "/" and at any subpath (e.g. "/orbit-flow/") without
      rebuilding. All asset hrefs below are intentionally relative so
      the runtime base resolves them.
    -->
    <base href="/" />
    <!-- ?v=2: browsers keep favicons per address for a long time; bump it
         when the icons change so they are fetched again. -->
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=2" />
    <link rel="shortcut icon" href="favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2" />
    <link rel="manifest" href="site.webmanifest?v=2" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Flow</title>
    <script>
      // Apply the saved theme before the first paint (see useTheme.ts).
      try {
        if (localStorage.getItem('orbit-flow-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {}
    </script>
    <style>
      html[data-theme="dark"] body { background-color: #000000; }
      body {
        margin: 0;
        padding: 0;
        background-color: #f2f2f7;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
