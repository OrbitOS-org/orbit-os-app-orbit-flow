<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
  <!--
    LOOPZE launcher icon — the app's actual logo (a blue lightning bolt,
    #58a6ff), same path geometry as frontend/public/logo.svg (scaled and
    centered here), on the dark rounded-square background this OrbitOS
    ecosystem's launcher tiles use.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="bolt" x1="15.85" y1="13" x2="48.15" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8ec5ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Soft glow pass (blurred duplicate beneath the crisp bolt) -->
  <polygon points="34.85,13 15.85,35.8 31.05,35.8 29.15,51 48.15,28.2 32.95,28.2"
           fill="#58a6ff" opacity="0.45" filter="url(#glow)"/>

  <!-- The bolt itself -->
  <polygon points="34.85,13 15.85,35.8 31.05,35.8 29.15,51 48.15,28.2 32.95,28.2"
           fill="url(#bolt)"/>
</svg>
